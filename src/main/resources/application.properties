spring.application.name=GOW.API 
server.port=8080 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/gow?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true 
spring.datasource.username=root
spring.datasource.password=root


# Note: In newer Spring Boot versions, you usually don't need the line below 
# because it's inferred, but it's good to check:

#JPA 
spring.jpa.generate-ddl=true 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true 
# Table names physically 
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl